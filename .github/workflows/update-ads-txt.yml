name: Update ads.txt

on:
  schedule:
    # Daily ~06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ads-txt
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the job can push back to the default branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Ezoic ads.txt
        env:
          ADS_TXT_URL: https://srv.adstxtmanager.com/19390/costcodle.com
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # -f: fail on HTTP errors so we never overwrite with an empty/error body
          if ! curl -fsSL --retry 3 --retry-delay 2 -o "$tmp" "$ADS_TXT_URL"; then
            echo "::error::Failed to download ads.txt from Ezoic; leaving repo ads.txt unchanged."
            exit 1
          fi
          if [ ! -s "$tmp" ]; then
            echo "::error::Downloaded ads.txt was empty; leaving repo ads.txt unchanged."
            exit 1
          fi
          # Normalize to UTF-8 LF for stable diffs across runners.
          tr -d '\r' < "$tmp" > ads.txt.new
          rm -f "$tmp"
          if [ ! -s ads.txt.new ]; then
            echo "::error::Normalized ads.txt was empty; leaving repo ads.txt unchanged."
            exit 1
          fi
          # Ensure trailing newline
          if [ "$(tail -c1 ads.txt.new | wc -l)" -eq 0 ]; then
            printf '\n' >> ads.txt.new
          fi
          mv ads.txt.new ads.txt

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- ads.txt; then
            echo "ads.txt unchanged; nothing to commit."
            exit 0
          fi

          git add ads.txt
          git commit -m "chore: sync ads.txt from Ezoic"
          git push
